<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Soundify">
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0c"/>
      <stop offset="1" stop-color="#121218"/>
    </linearGradient>
    <radialGradient id="isik1" cx="0.25" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#1ed760" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1ed760" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="isik2" cx="0.8" cy="0.75" r="0.55">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="isik3" cx="0.55" cy="0.1" r="0.5">
      <stop offset="0" stop-color="#7b6cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7b6cff" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes kay1 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(60px,24px) } }
      @keyframes kay2 { 0%,100% { transform: translate(0,0) } 50% { transform: translate(-70px,-20px) } }
      @keyframes nabiz { 0%,100% { opacity: .55; transform: scale(1) } 50% { opacity: 1; transform: scale(1.06) } }
      @keyframes cubuk { 0%,100% { transform: scaleY(.35) } 50% { transform: scaleY(1) } }
      .i1 { animation: kay1 9s ease-in-out infinite }
      .i2 { animation: kay2 11s ease-in-out infinite }
      .i3 { animation: kay1 13s ease-in-out infinite reverse }
      .dalga { transform-box: fill-box; transform-origin: 0% 50%; animation: nabiz 2.4s ease-in-out infinite }
      .d2 { animation-delay: .25s } .d3 { animation-delay: .5s }
      .eq rect { transform-box: fill-box; transform-origin: 50% 100%; animation: cubuk 1s ease-in-out infinite }
      .eq rect:nth-child(2) { animation-duration: .8s; animation-delay: .2s }
      .eq rect:nth-child(3) { animation-duration: 1.2s; animation-delay: .1s }
      .eq rect:nth-child(4) { animation-duration: .9s; animation-delay: .35s }
      .eq rect:nth-child(5) { animation-duration: 1.1s; animation-delay: .05s }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>
  <rect width="1200" height="340" rx="28" fill="url(#zemin)"/>
  <rect class="i1" width="1200" height="340" fill="url(#isik1)"/>
  <rect class="i2" width="1200" height="340" fill="url(#isik2)"/>
  <rect class="i3" width="1200" height="340" fill="url(#isik3)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- Logo: C + büyüyen üç dalga -->
  <g transform="translate(96 74) scale(0.62)">
    <path d="M216.69,141.24 A115.02,115.02 0 0 0 216.69,370.76 L216.69,324.57 A69.01,69.01 0 0 1 216.69,187.43 Z" fill="#f2f3f7" transform="translate(-96 -118)"/>
    <g transform="translate(-96 -118)">
      <path class="dalga" d="M233.60,202.08 A54.69,54.69 0 0 1 233.60,309.92 Z" fill="#7b6cff"/>
      <path class="dalga d2" d="M294.81,163.33 A116.32,116.32 0 0 1 294.81,348.67 Z" fill="#1fc6ff"/>
      <path class="dalga d3" d="M356.44,136.59 A177.95,177.95 0 0 1 356.44,375.41 Z" fill="#19e0b4"/>
    </g>
  </g>
  <text x="330" y="158" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Soundify</text>
  <text x="333" y="206" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#b4b4bc">Spotify ve SoundCloud · tek pencere, tek kuyruk</text>
  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600">
    <rect x="333" y="236" width="128" height="34" rx="17" fill="#1ed760" fill-opacity="0.14" stroke="#1ed760" stroke-opacity="0.5"/>
    <text x="397" y="258" text-anchor="middle" fill="#1ed760">Spotify</text>
    <rect x="473" y="236" width="150" height="34" rx="17" fill="#ff7a1a" fill-opacity="0.14" stroke="#ff7a1a" stroke-opacity="0.5"/>
    <text x="548" y="258" text-anchor="middle" fill="#ff7a1a">SoundCloud</text>
    <rect x="635" y="236" width="150" height="34" rx="17" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="710" y="258" text-anchor="middle" fill="#e6e6ea">Rust · egui</text>
  </g>
  <g class="eq" transform="translate(1000 112)" fill="#1ed760">
    <rect x="0" y="0" width="16" height="116" rx="8"/>
    <rect x="28" y="0" width="16" height="116" rx="8" fill="#19e0b4"/>
    <rect x="56" y="0" width="16" height="116" rx="8" fill="#1fc6ff"/>
    <rect x="84" y="0" width="16" height="116" rx="8" fill="#7b6cff"/>
    <rect x="112" y="0" width="16" height="116" rx="8" fill="#ff7a1a"/>
  </g>
</svg>
